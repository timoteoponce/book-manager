<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookshelf</title>
  <style>
    :root { --bg: #f4f1eb; --panel: #fffdf8; --ink: #24231f; --muted: #625f58; --line: #d4cec3; --accent: #8b3f25; --accent-ink: #fff; --danger: #a3312d; --focus: #1d5f8a; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
    .app-header { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: auto minmax(220px, 1fr) auto; gap: 18px; align-items: center; border-bottom: 1px solid var(--line); padding: 12px max(20px, calc((100vw - 1180px) / 2)); background: rgba(244,241,235,.96); backdrop-filter: blur(12px); }
    .brand h1 { margin: 0; font: 700 25px Georgia, serif; letter-spacing: -.03em; } .brand p { color: var(--muted); margin: 1px 0 0; font-size: 12px; }
    .header-search input { width: 100%; min-width: 0; } .quick-actions { display: flex; align-items: center; gap: 7px; } .quick-actions > button { white-space: nowrap; } .menu { position: relative; } .menu summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 8px 12px; font-size: 20px; line-height: 1; } .menu summary::-webkit-details-marker { display: none; } .menu-panel { position: absolute; right: 0; top: calc(100% + 8px); display: grid; gap: 8px; width: 230px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); box-shadow: 0 10px 30px #0002; } .menu-panel label { color: var(--muted); font-size: 12px; } .menu-panel select, .menu-panel button { width: 100%; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
    input, select, button { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); padding: 10px 12px; font: inherit; } input { flex: 1 1 300px; } button { cursor: pointer; } button:hover:not(:disabled), button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { border-color: var(--focus); outline: 3px solid rgba(29,95,138,.25); outline-offset: 1px; } button:disabled { cursor: not-allowed; opacity: .48; } .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .danger { background: var(--danger); border-color: var(--danger); color: var(--accent-ink); }
    #summary { color: var(--muted); margin: 12px 0 18px; } .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    article { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; } article.unavailable { opacity: .65; } article h2 { font: 600 18px Georgia, serif; margin: 0 0 7px; overflow-wrap: anywhere; } article p { margin: 4px 0; color: var(--muted); overflow-wrap: anywhere; } .book-check { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; } .cover-frame { display: grid; place-items: center; width: 100%; height: 170px; margin-bottom: 14px; background: var(--bg); border-radius: 5px; overflow: hidden; } .cover { display: block; width: 100%; height: 100%; object-fit: contain; object-position: left center; opacity: 0; transition: opacity .16s ease; } .cover.loaded { opacity: 1; } .cover-fallback { color: var(--muted); font-size: 12px; } .detail-cover-frame { display: grid; place-items: center; width: 220px; height: 300px; margin: 0 0 18px; background: var(--bg); border-radius: 5px; overflow: hidden; } .detail-cover { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; transition: opacity .16s ease; } .detail-cover.loaded { opacity: 1; } .folder { font-size: 12px; } .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 13px 0; } .badge { border: 1px solid var(--line); border-radius: 99px; color: var(--muted); padding: 3px 8px; font-size: 12px; text-transform: uppercase; } .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .actions > span { display: flex; gap: 8px; } .empty { color: var(--muted); text-align: center; padding: 50px 10px; grid-column: 1 / -1; } .loading { font: 18px Georgia, serif; min-height: 180px; }
    dialog { width: min(900px, calc(100% - 30px)); max-height: calc(100% - 30px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); } dialog::backdrop { background: #0008; } .detail { padding: 24px; } .detail header { padding: 0 0 16px; border: 0; } .detail h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; overflow-wrap: anywhere; } .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 18px; margin: 20px 0; } .detail dt { color: var(--muted); } .detail dd { margin: 0; overflow-wrap: anywhere; } .detail label { display: block; color: var(--muted); margin: 14px 0 5px; } .detail textarea { width: 100%; min-height: 90px; resize: vertical; } .detail-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; } .dialog-actions { position: sticky; top: 0; z-index: 3; justify-content: flex-start; margin: -10px 0 16px; padding: 10px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    .organization { padding: 24px; } .organization h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; } .organization p { color: var(--muted); } .organization-table { width: 100%; border-collapse: collapse; margin-top: 18px; } .organization-table th, .organization-table td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 9px 6px; overflow-wrap: anywhere; } .organization-table th { color: var(--muted); font-weight: 500; } .collision { color: var(--accent); font-weight: 600; }
    .cleanup { padding: 24px; } .cleanup h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; } .cleanup p { color: var(--muted); } .candidate { display: grid; grid-template-columns: max-content 1fr; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; } .candidate input { margin-top: 3px; } .candidate strong { display: block; } .candidate small { color: var(--muted); overflow-wrap: anywhere; } .candidate .reason { color: var(--accent); font-size: 12px; text-transform: uppercase; }
    .online { padding: 24px; } .online h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; } .online p { color: var(--muted); } .online-book { border-top: 1px solid var(--line); padding: 16px 0; } .online-option { display: grid; grid-template-columns: max-content max-content 1fr; gap: 12px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; } .online-option img { width: 55px; height: 75px; object-fit: contain; } .online-option strong { display: block; } .online-option small { color: var(--muted); } .metadata-search { display: flex; gap: 8px; margin: 16px 0; } .metadata-search input { flex: 1; }
    .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 30; display: grid; gap: 8px; width: min(360px, calc(100vw - 40px)); } .toast { border: 1px solid var(--line); border-left: 4px solid var(--focus); border-radius: 8px; padding: 12px 14px; background: var(--panel); box-shadow: 0 8px 24px #0002; } .toast.error { border-left-color: var(--danger); } .confirm-content { min-width: min(420px, calc(100vw - 60px)); padding: 24px; } .confirm-content p { margin: 0; }
    @media (max-width: 800px) { .app-header { grid-template-columns: 1fr auto; gap: 10px; padding: 10px 14px; } .header-search { grid-column: 1 / -1; grid-row: 2; } .quick-actions { max-width: 52vw; overflow-x: auto; } .quick-actions > button { display: none; } .menu-panel { position: fixed; right: 14px; top: 58px; } main { padding: 18px 14px 48px; } }
  </style>
</head>
<body>
  <header class="app-header"><div class="brand"><h1>Bookshelf</h1><p>Local catalogue</p></div><div class="header-search"><input id="search" type="search" placeholder="Search books, authors, folders, or filenames" autofocus></div><div class="quick-actions"><button id="sync" class="primary">Sync</button><button id="refresh-metadata">Refresh metadata</button><button id="fetch-online">Fetch online</button><button id="delete-books" class="danger" disabled>Delete (0)</button><details class="menu"><summary aria-label="More actions">⋮</summary><div class="menu-panel"><label for="format">Format</label><select id="format"><option value="">All formats</option><option>epub</option><option>pdf</option><option>cbz</option><option>mobi</option><option>azw3</option><option>fb2</option><option>txt</option></select><label for="status">Reading status</label><select id="status"><option value="">All reading states</option><option value="unread">Unread</option><option value="reading">Reading</option><option value="finished">Finished</option><option value="paused">Paused</option><option value="__none__">Not set</option></select><button id="review-online">Review online matches</button><button id="organize">Organization preview</button><button id="cleanup">Cleanup candidates</button><a href="/api/export"><button type="button">Export metadata</button></a></div></details></div></header>
  <main>
    <div id="summary" aria-live="polite">Loading catalogue...</div><section id="books" class="grid"></section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <dialog id="confirm-dialog"><div class="confirm-content"><p id="confirm-message"></p><div class="detail-actions dialog-actions"><button id="confirm-cancel">Cancel</button><button id="confirm-ok" class="danger">Continue</button></div></div></dialog>
  <dialog id="detail-dialog"><div id="detail-content" class="detail"></div></dialog>
  <dialog id="organize-dialog"><div id="organize-content" class="organization"></div></dialog>
  <dialog id="cleanup-dialog"><div id="cleanup-content" class="cleanup"></div></dialog>
  <dialog id="online-dialog"><div id="online-content" class="online"></div></dialog>
  <script>
    const search = document.querySelector('#search'), format = document.querySelector('#format'), status = document.querySelector('#status'), books = document.querySelector('#books'), summary = document.querySelector('#summary'), sync = document.querySelector('#sync');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const size = bytes => bytes < 1048576 ? `${Math.round(bytes / 1024)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
    function notify(message, type = 'info') { const toast = document.createElement('div'); toast.className = `toast ${type}`; toast.textContent = message; document.querySelector('#toasts').append(toast); setTimeout(() => toast.remove(), 5000); }
    function ask(message) { return new Promise(resolve => { const dialog = document.querySelector('#confirm-dialog'), text = document.querySelector('#confirm-message'); text.textContent = message; const cancel = document.querySelector('#confirm-cancel'), ok = document.querySelector('#confirm-ok'); const finish = value => { dialog.close(); cancel.onclick = null; ok.onclick = null; resolve(value); }; cancel.onclick = () => finish(false); ok.onclick = () => finish(true); dialog.showModal(); }); }
    async function load() {
      const params = new URLSearchParams({q: search.value, format: format.value, status: status.value});
      const [response, syncResponse] = await Promise.all([fetch('/api/books?' + params), fetch('/api/sync/status')]); const data = await response.json(); const syncData = await syncResponse.json();
      const unavailable = data.books.filter(book => !book.available).length;
      if (syncData.syncing) { wasSyncing = true; summary.textContent = `Syncing bookshelf... ${data.count} books currently indexed`; books.innerHTML = '<div class="empty loading">Reading the bookshelf and building the catalogue...</div>'; return; }
      wasSyncing = false;
      if (syncData.error) { summary.textContent = `Sync failed: ${esc(syncData.error)}`; } else { summary.textContent = `${data.count} ${data.count === 1 ? 'book' : 'books'} indexed${unavailable ? `, ${unavailable} unavailable` : ''}`; }
      books.innerHTML = data.books.length ? data.books.map(book => `<article class="${book.available ? '' : 'unavailable'}">${book.available ? `<input class="book-check" type="checkbox" value="${book.id}" aria-label="Select ${esc(book.title)}">` : ''}${book.available && book.format === 'epub' ? `<div class="cover-frame"><span class="cover-fallback">No cover</span><img class="cover" src="/api/cover/${book.id}" loading="lazy" alt="" onload="this.classList.add('loaded')" onerror="this.remove()"></div>` : ''}<h2>${esc(book.title)}</h2>${book.author ? `<p>by ${esc(book.author)}</p>` : ''}<p class="folder">${esc(book.folder === '.' ? 'Bookshelf root' : book.folder)}</p><div class="meta"><span class="badge">${esc(book.format)}</span><span class="badge">${size(book.size)}</span>${book.status ? `<span class="badge">${esc(book.status)}</span>` : ''}${book.available ? '' : '<span class="badge">Unavailable</span>'}</div><div class="actions"><small title="${esc(book.path)}">${esc(book.filename)}</small><span>${book.available ? `<button class="primary" onclick="openBook(${book.id})">Open</button>` : ''}<button onclick="showBook(${book.id})">Details</button></span></div></article>`).join('') : '<div class="empty">No books match this search.</div>';
      document.querySelectorAll('.book-check').forEach(input => input.addEventListener('change', updateBookSelection)); updateBookSelection();
    }
    async function openBook(id) { const response = await fetch('/api/open/' + id, {method: 'POST'}); if (!response.ok) notify(await response.text(), 'error'); }
    async function showBook(id) {
      const response = await fetch('/api/book/' + id); if (!response.ok) { notify(await response.text(), 'error'); return; }
      const book = await response.json(); const dialog = document.querySelector('#detail-dialog');
      document.querySelector('#detail-content').innerHTML = `<header>${book.available && book.format === 'epub' ? `<div class="detail-cover-frame"><span class="cover-fallback">No cover</span><img class="detail-cover" src="/api/cover/${book.id}" alt="" onload="this.classList.add('loaded')" onerror="this.remove()"></div>` : ''}<h2>${esc(book.title)}</h2>${book.author ? `<p>by ${esc(book.author)}</p>` : ''}</header><dl><dt>File</dt><dd>${esc(book.filename)}</dd><dt>Folder</dt><dd>${esc(book.folder === '.' ? 'Bookshelf root' : book.folder)}</dd><dt>Format</dt><dd>${esc(book.format.toUpperCase())}</dd><dt>Size</dt><dd>${size(book.size)}</dd><dt>Modified</dt><dd>${esc(new Date(book.modifiedAt).toLocaleString())}</dd>${book.publisher ? `<dt>Publisher</dt><dd>${esc(book.publisher)}</dd>` : ''}${book.publishedAt ? `<dt>Published</dt><dd>${esc(book.publishedAt)}</dd>` : ''}${book.isbn ? `<dt>ISBN</dt><dd>${esc(book.isbn)}</dd>` : ''}${book.language ? `<dt>Language</dt><dd>${esc(book.language)}</dd>` : ''}<dt>State</dt><dd>${book.available ? 'Available' : 'Unavailable'}</dd></dl><div class="metadata-search"><input id="metadata-query" value="${esc(book.title)}" placeholder="Title, author, or ISBN"><button onclick="searchBookMetadata(${book.id})">Search metadata</button></div>${book.available ? '<p>Open this book with your system reader.</p>' : '<p>This file is unavailable. Sync after locating it in the file browser.</p>'}<label for="book-status">Reading status</label><select id="book-status"><option value="">Not set</option><option value="unread">Unread</option><option value="reading">Reading</option><option value="finished">Finished</option><option value="paused">Paused</option></select><label for="book-tags">Tags</label><input id="book-tags" value="${esc(book.tags)}" placeholder="programming, design, reference"><label for="book-notes">Notes</label><textarea id="book-notes" placeholder="Personal notes">${esc(book.notes)}</textarea><div class="detail-actions">${book.available ? `<button class="primary" onclick="openBook(${book.id})">Open with system reader</button><button onclick="deleteSingleBook(${book.id})">Delete book</button>` : ''}<button class="primary" onclick="saveBook(${book.id})">Save metadata</button><button onclick="document.querySelector('#detail-dialog').close()">Close</button></div>`;
      pinDialogActions('#detail-content'); document.querySelector('#book-status').value = book.status; dialog.showModal();
    }
    function pinDialogActions(selector) { const root = document.querySelector(selector); const actions = root.querySelector('.detail-actions'); if (actions) { actions.classList.add('dialog-actions'); root.prepend(actions); } }
    async function saveBook(id) { const body = {status: document.querySelector('#book-status').value, tags: document.querySelector('#book-tags').value, notes: document.querySelector('#book-notes').value}; const response = await fetch('/api/book/' + id, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); if (!response.ok) { notify(await response.text(), 'error'); return; } document.querySelector('#detail-dialog').close(); notify('Book metadata saved.'); await load(); }
    function updateBookSelection() { const count = document.querySelectorAll('.book-check:checked').length; const button = document.querySelector('#delete-books'); button.textContent = `Delete (${count})`; button.disabled = count === 0; }
    async function deleteSingleBook(id) { if (!(await ask('Move this book to recoverable cleanup trash?'))) return; await deleteBooks([id]); }
    async function deleteSelectedBooks() { const ids = [...document.querySelectorAll('.book-check:checked')].map(input => Number(input.value)); if (!ids.length) return; if (!(await ask(`Move ${ids.length} selected book${ids.length === 1 ? '' : 's'} to recoverable cleanup trash?`))) return; await deleteBooks(ids); }
    async function deleteBooks(ids) { const response = await fetch('/api/books/delete', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids})}); if (!response.ok) { notify(await response.text(), 'error'); return; } const result = await response.json(); document.querySelector('#detail-dialog').close(); notify(`${result.deleted} book${result.deleted === 1 ? '' : 's'} moved to recoverable trash.`); await load(); }
    async function searchBookMetadata(id) { const input = document.querySelector('#metadata-query'), button = document.querySelector('.metadata-search button'); const query = input.value.trim(); if (!query) { notify('Enter a title, author, or ISBN.', 'error'); return; } button.disabled = true; button.textContent = 'Searching...'; try { const response = await fetch('/api/metadata/search', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({bookId: id, query})}); if (!response.ok) throw new Error(await response.text()); const result = await response.json(); if (!result.candidates) { notify('No online matches found.'); return; } await showOnlineCandidates(); } catch (error) { notify(error.message, 'error'); } finally { button.disabled = false; button.textContent = 'Search metadata'; } }
    let wasSyncing = false, metadataWatching = false;
    function setMetadataButtons(status) { const local = document.querySelector('#refresh-metadata'), online = document.querySelector('#fetch-online'); const running = status.running; local.disabled = running; online.disabled = running; if (running) { const progress = status.total ? ` ${status.current}/${status.total}` : ''; const label = status.operation === 'online' ? 'Fetching online metadata' : 'Refreshing metadata'; local.textContent = status.operation === 'local' ? label + progress : 'Refresh metadata'; online.textContent = status.operation === 'online' ? label + progress : 'Fetch online metadata'; } else { local.textContent = 'Refresh metadata'; online.textContent = 'Fetch online metadata'; } }
    async function pollMetadataStatus() { const response = await fetch('/api/metadata/status'); if (!response.ok) return; const statusData = await response.json(); setMetadataButtons(statusData); if (metadataWatching && !statusData.running) { metadataWatching = false; if (statusData.error) notify(statusData.error, 'error'); else if (statusData.operation === 'online') { notify(`Online metadata fetch complete. ${statusData.failed} lookups failed.`); showOnlineCandidates(); } else { notify(`Metadata refresh complete. ${statusData.failed} files could not be read.`); } await load(); } }
    async function pollSyncStatus() { const response = await fetch('/api/sync/status'); if (!response.ok) return; const data = await response.json(); if (data.syncing) { wasSyncing = true; summary.textContent = 'Syncing bookshelf...'; return; } if (wasSyncing) { wasSyncing = false; await load(); } }
    async function startMetadataJob(endpoint, confirmMessage) { if (confirmMessage && !(await ask(confirmMessage))) return; const response = await fetch(endpoint, {method: 'POST'}); if (!response.ok) { notify(await response.text(), 'error'); return; } metadataWatching = true; await pollMetadataStatus(); }
    async function refreshMetadata() { await startMetadataJob('/api/metadata/refresh'); }
    async function fetchOnlineMetadata() { await startMetadataJob('/api/metadata/fetch-online', 'Contact Open Library and fetch review candidates? Existing metadata will not be changed.'); }
    async function showOnlineCandidates() { const response = await fetch('/api/metadata/candidates'); if (!response.ok) { notify(await response.text(), 'error'); return; } const data = await response.json(); const grouped = {}; data.candidates.forEach(item => (grouped[item.bookId] ||= {title: item.bookTitle, candidates: []}).candidates.push(item)); const sections = Object.values(grouped).map(group => `<section class="online-book"><h3>${esc(group.title)}</h3>${group.candidates.map(item => `<label class="online-option"><input type="radio" name="online-book-${item.bookId}" value="${item.id}"><span>${item.coverUrl ? `<img src="${esc(item.coverUrl)}" alt="" onerror="this.style.display='none'">` : ''}</span><span><strong>${esc(item.title)}</strong><small>${esc(item.author)}${item.publisher ? ` · ${esc(item.publisher)}` : ''}${item.publishedAt ? ` · ${esc(item.publishedAt)}` : ''}${item.isbn ? ` · ISBN ${esc(item.isbn)}` : ''}</small></span></label>`).join('')}</section>`).join(''); document.querySelector('#online-content').innerHTML = `<h2>Online metadata candidates</h2><p>Choose the correct match for each book. Nothing is applied until you confirm.</p>${sections || '<p>No online candidates are waiting for review.</p>'}<div class="detail-actions"><span id="online-selected-count">Selected: 0</span>${data.count ? '<button class="primary" onclick="applyOnlineMetadata()">Apply selected metadata</button>' : ''}<button onclick="document.querySelector('#online-dialog').close()">Close</button></div>`; pinDialogActions('#online-content'); document.querySelectorAll('.online-option input').forEach(input => input.addEventListener('change', updateOnlineSelectedCount)); updateOnlineSelectedCount(); document.querySelector('#online-dialog').showModal(); }
    async function applyOnlineMetadata() { const ids = [...document.querySelectorAll('.online-option input:checked')].map(input => Number(input.value)); if (!ids.length) { notify('Select at least one metadata match.', 'error'); return; } const response = await fetch('/api/metadata/apply-online', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({candidateIds: ids})}); if (!response.ok) { notify(await response.text(), 'error'); return; } const result = await response.json(); notify(`Applied metadata to ${result.applied} books.`); document.querySelector('#online-dialog').close(); await load(); }
    function updateOnlineSelectedCount() { const count = document.querySelectorAll('.online-option input:checked').length; const indicator = document.querySelector('#online-selected-count'); const button = document.querySelector('#online-content .dialog-actions .primary'); if (indicator) indicator.textContent = `Selected: ${count}`; if (button) button.disabled = count === 0; }
    async function showOrganization() { const response = await fetch('/api/organize/preview'); if (!response.ok) { notify(await response.text(), 'error'); return; } const data = await response.json(); const dialog = document.querySelector('#organize-dialog'); const rows = data.proposals.map(item => `<tr><td>${esc(item.current)}</td><td>${esc(item.proposed)}${item.collision ? ' <span class="collision">Collision</span>' : ''}</td></tr>`).join(''); const hasCollision = data.proposals.some(item => item.collision); document.querySelector('#organize-content').innerHTML = `<h2>Organization preview</h2><p>This is a proposal only. No files have been moved or renamed. Topics and reading status stay in metadata rather than folders.</p><table class="organization-table"><thead><tr><th>Current path</th><th>Human-readable proposal</th></tr></thead><tbody>${rows || '<tr><td colspan="2">No available books.</td></tr>'}</tbody></table><div class="detail-actions">${hasCollision ? '<span class="collision">Resolve collisions before applying.</span>' : '<button class="primary" onclick="applyOrganization()">Apply moves</button>'}<button onclick="undoOrganization()">Undo last run</button><button onclick="document.querySelector('#organize-dialog').close()">Close</button></div>`; pinDialogActions('#organize-content'); dialog.showModal(); }
    async function applyOrganization() { if (!(await ask('Move files into the proposed Author/Title/Title.ext folders? This will not overwrite files.'))) return; const response = await fetch('/api/organize/apply', {method: 'POST'}); if (!response.ok) { notify(await response.text(), 'error'); return; } const result = await response.json(); notify(`${result.moved} files moved.`); document.querySelector('#organize-dialog').close(); await load(); }
    async function undoOrganization() { if (!(await ask('Undo the latest organization run?'))) return; const response = await fetch('/api/organize/undo', {method: 'POST'}); if (!response.ok) { notify(await response.text(), 'error'); return; } const result = await response.json(); notify(`${result.undone} files restored.`); document.querySelector('#organize-dialog').close(); await load(); }
    async function showCleanup() { const response = await fetch('/api/cleanup/candidates'); if (!response.ok) { notify(await response.text(), 'error'); return; } const data = await response.json(); const dialog = document.querySelector('#cleanup-dialog'); const cards = data.candidates.map(item => `<label class="candidate"><input class="cleanup-check" type="checkbox" value="${item.id}"><span><span class="reason">${esc(item.reason.replaceAll('_', ' '))}</span><strong>${esc(item.title || item.path)}</strong><small>${esc(item.path)}${item.duplicateOf ? `<br>Keep: ${esc(item.duplicateOf)}` : ''}</small>${item.reason === 'unavailable_record' ? '<p>This only removes the missing record from the catalogue.</p>' : '<p>The file will be moved to the recoverable cleanup trash.</p>'}</span></label>`).join(''); document.querySelector('#cleanup-content').innerHTML = `<h2>Cleanup candidates (${data.count})</h2><p>Select candidates to process. Book files are moved to <code>.book-manager/trash/</code>, not permanently deleted. Unavailable records are forgotten from SQLite.</p>${cards || '<p>No cleanup candidates found.</p>'}<div class="detail-actions"><span id="cleanup-selected-count">Selected: 0</span>${data.count ? '<button class="primary" onclick="deleteCleanup()">Delete selected candidates</button>' : ''}<button onclick="document.querySelector('#cleanup-dialog').close()">Close</button></div>`; pinDialogActions('#cleanup-content'); document.querySelectorAll('.cleanup-check').forEach(input => input.addEventListener('change', updateCleanupSelectedCount)); updateCleanupSelectedCount(); dialog.showModal(); }
    async function deleteCleanup() { const ids = [...document.querySelectorAll('.cleanup-check:checked')].map(input => Number(input.value)); if (!ids.length) { notify('Select at least one candidate.', 'error'); return; } if (!(await ask('Process the selected cleanup candidates? Book files will be moved to recoverable trash.'))) return; const response = await fetch('/api/cleanup/delete', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids})}); if (!response.ok) { notify(await response.text(), 'error'); return; } const result = await response.json(); notify(`${result.deleted} files moved to cleanup trash; ${result.forgotten} records forgotten.`); document.querySelector('#cleanup-dialog').close(); await load(); }
    function updateCleanupSelectedCount() { const count = document.querySelectorAll('.cleanup-check:checked').length; const indicator = document.querySelector('#cleanup-selected-count'); const button = document.querySelector('#cleanup-content .dialog-actions .primary'); if (indicator) indicator.textContent = `Selected: ${count}`; if (button) button.disabled = count === 0; }
    async function forgetRecord(id) { if (!(await ask('Remove this unavailable record from the catalogue? The original file is already missing and will not be touched.'))) return; const response = await fetch('/api/cleanup/forget/' + id, {method: 'POST'}); if (!response.ok) { notify(await response.text(), 'error'); return; } showCleanup(); await load(); }
    function heartbeat() { fetch('/api/heartbeat', {method: 'POST', keepalive: true}).catch(() => {}); }
    let timer; search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 150); }); format.addEventListener('change', load); status.addEventListener('change', load);
    document.querySelector('#organize').addEventListener('click', showOrganization);
    document.querySelector('#cleanup').addEventListener('click', showCleanup);
    document.querySelector('#refresh-metadata').addEventListener('click', refreshMetadata);
    document.querySelector('#fetch-online').addEventListener('click', fetchOnlineMetadata);
    document.querySelector('#review-online').addEventListener('click', showOnlineCandidates);
    document.querySelector('#delete-books').addEventListener('click', deleteSelectedBooks);
    sync.addEventListener('click', async () => { sync.disabled = true; sync.textContent = 'Syncing...'; try { const response = await fetch('/api/sync', {method: 'POST'}); if (!response.ok) throw new Error(await response.text()); await load(); } catch (error) { summary.textContent = `Sync failed: ${error.message}`; } finally { sync.disabled = false; sync.textContent = 'Sync bookshelf'; } });
    heartbeat(); setInterval(heartbeat, 5000); window.addEventListener('pagehide', () => navigator.sendBeacon('/api/heartbeat', '')); load(); pollMetadataStatus(); setInterval(pollSyncStatus, 2000); setInterval(pollMetadataStatus, 1000);
  </script>
</body>
