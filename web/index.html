<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookshelf</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f1eb; --panel: #fffdf8; --ink: #24231f; --muted: #777268; --line: #ded8cd; --accent: #9b4d2f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #201f1c; --panel: #2a2925; --ink: #f2eee5; --muted: #aaa398; --line: #45413a; --accent: #e18a64; } }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
    header { border-bottom: 1px solid var(--line); padding: 28px max(20px, calc((100vw - 1180px) / 2)); }
    header h1 { margin: 0 0 5px; font: 700 30px Georgia, serif; letter-spacing: -.03em; } header p { color: var(--muted); margin: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; } input, select, button { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); padding: 10px 12px; font: inherit; } input { flex: 1 1 300px; } button { cursor: pointer; } button:hover { border-color: var(--accent); } .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #summary { color: var(--muted); margin: 12px 0 18px; } .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; } article.unavailable { opacity: .65; } article h2 { font: 600 18px Georgia, serif; margin: 0 0 7px; overflow-wrap: anywhere; } article p { margin: 4px 0; color: var(--muted); overflow-wrap: anywhere; } .cover { display: block; width: 100%; height: 170px; object-fit: contain; object-position: left center; margin-bottom: 14px; background: var(--bg); border-radius: 5px; } .detail-cover { display: block; max-width: 220px; max-height: 300px; object-fit: contain; margin: 0 0 18px; border-radius: 5px; } .folder { font-size: 12px; } .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 13px 0; } .badge { border: 1px solid var(--line); border-radius: 99px; color: var(--muted); padding: 3px 8px; font-size: 12px; text-transform: uppercase; } .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .actions > span { display: flex; gap: 8px; } .empty { color: var(--muted); text-align: center; padding: 50px 10px; grid-column: 1 / -1; } .loading { font: 18px Georgia, serif; min-height: 180px; }
    dialog { width: min(900px, calc(100% - 30px)); max-height: calc(100% - 30px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); } dialog::backdrop { background: #0008; } .detail { padding: 24px; } .detail header { padding: 0 0 16px; border: 0; } .detail h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; overflow-wrap: anywhere; } .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 18px; margin: 20px 0; } .detail dt { color: var(--muted); } .detail dd { margin: 0; overflow-wrap: anywhere; } .detail label { display: block; color: var(--muted); margin: 14px 0 5px; } .detail textarea { width: 100%; min-height: 90px; resize: vertical; } .detail-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; } .dialog-actions { position: sticky; top: 0; z-index: 3; justify-content: flex-start; margin: -10px 0 16px; padding: 10px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    .organization { padding: 24px; } .organization h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; } .organization p { color: var(--muted); } .organization-table { width: 100%; border-collapse: collapse; margin-top: 18px; } .organization-table th, .organization-table td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 9px 6px; overflow-wrap: anywhere; } .organization-table th { color: var(--muted); font-weight: 500; } .collision { color: var(--accent); font-weight: 600; }
    .cleanup { padding: 24px; } .cleanup h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; } .cleanup p { color: var(--muted); } .candidate { display: grid; grid-template-columns: max-content 1fr; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; } .candidate input { margin-top: 3px; } .candidate strong { display: block; } .candidate small { color: var(--muted); overflow-wrap: anywhere; } .candidate .reason { color: var(--accent); font-size: 12px; text-transform: uppercase; }
    .online { padding: 24px; } .online h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; } .online p { color: var(--muted); } .online-book { border-top: 1px solid var(--line); padding: 16px 0; } .online-option { display: grid; grid-template-columns: max-content max-content 1fr; gap: 12px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; } .online-option img { width: 55px; height: 75px; object-fit: contain; } .online-option strong { display: block; } .online-option small { color: var(--muted); } .metadata-search { display: flex; gap: 8px; margin: 16px 0; } .metadata-search input { flex: 1; }
  </style>
</head>
<body>
  <header><h1>Bookshelf</h1><p>A local catalogue of your existing files. Nothing is moved or renamed during sync.</p></header>
  <main>
    <div class="toolbar"><input id="search" type="search" placeholder="Search title, author, folder, or filename" autofocus><select id="format"><option value="">All formats</option><option>epub</option><option>pdf</option><option>cbz</option><option>mobi</option><option>azw3</option><option>fb2</option><option>txt</option></select><select id="status"><option value="">All reading states</option><option value="unread">Unread</option><option value="reading">Reading</option><option value="finished">Finished</option><option value="paused">Paused</option><option value="__none__">Not set</option></select><button id="sync" class="primary">Sync bookshelf</button><button id="refresh-metadata">Refresh metadata</button><button id="fetch-online">Fetch online metadata</button><button id="review-online">Review online matches</button><a href="/api/export"><button type="button">Export metadata</button></a><button id="organize">Organization preview</button><button id="cleanup">Cleanup candidates</button></div>
    <div id="summary">Loading catalogue...</div><section id="books" class="grid"></section>
  </main>
  <dialog id="detail-dialog"><div id="detail-content" class="detail"></div></dialog>
  <dialog id="organize-dialog"><div id="organize-content" class="organization"></div></dialog>
  <dialog id="cleanup-dialog"><div id="cleanup-content" class="cleanup"></div></dialog>
  <dialog id="online-dialog"><div id="online-content" class="online"></div></dialog>
  <script>
    const search = document.querySelector('#search'), format = document.querySelector('#format'), status = document.querySelector('#status'), books = document.querySelector('#books'), summary = document.querySelector('#summary'), sync = document.querySelector('#sync');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const size = bytes => bytes < 1048576 ? `${Math.round(bytes / 1024)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
    async function load() {
      const params = new URLSearchParams({q: search.value, format: format.value, status: status.value});
      const [response, syncResponse] = await Promise.all([fetch('/api/books?' + params), fetch('/api/sync/status')]); const data = await response.json(); const syncData = await syncResponse.json();
      const unavailable = data.books.filter(book => !book.available).length;
      if (syncData.syncing) { summary.textContent = `Syncing bookshelf... ${data.count} books currently indexed`; books.innerHTML = '<div class="empty loading">Reading the bookshelf and building the catalogue...</div>'; return; }
      if (syncData.error) { summary.textContent = `Sync failed: ${esc(syncData.error)}`; } else { summary.textContent = `${data.count} ${data.count === 1 ? 'book' : 'books'} indexed${unavailable ? `, ${unavailable} unavailable` : ''}`; }
      books.innerHTML = data.books.length ? data.books.map(book => `<article class="${book.available ? '' : 'unavailable'}">${book.available && book.format === 'epub' ? `<img class="cover" src="/api/cover/${book.id}" loading="lazy" alt="" onerror="this.remove()">` : ''}<h2>${esc(book.title)}</h2>${book.author ? `<p>by ${esc(book.author)}</p>` : ''}<p class="folder">${esc(book.folder === '.' ? 'Bookshelf root' : book.folder)}</p><div class="meta"><span class="badge">${esc(book.format)}</span><span class="badge">${size(book.size)}</span>${book.status ? `<span class="badge">${esc(book.status)}</span>` : ''}${book.available ? '' : '<span class="badge">Unavailable</span>'}</div><div class="actions"><small title="${esc(book.path)}">${esc(book.filename)}</small><span>${book.available ? `<button class="primary" onclick="openBook(${book.id})">Open</button>` : ''}<button onclick="showBook(${book.id})">Details</button></span></div></article>`).join('') : '<div class="empty">No books match this search.</div>';
    }
    async function openBook(id) { const response = await fetch('/api/open/' + id, {method: 'POST'}); if (!response.ok) alert(await response.text()); }
    async function showBook(id) {
      const response = await fetch('/api/book/' + id); if (!response.ok) { alert(await response.text()); return; }
      const book = await response.json(); const dialog = document.querySelector('#detail-dialog');
      document.querySelector('#detail-content').innerHTML = `<header>${book.available && book.format === 'epub' ? `<img class="detail-cover" src="/api/cover/${book.id}" alt="" onerror="this.remove()">` : ''}<h2>${esc(book.title)}</h2>${book.author ? `<p>by ${esc(book.author)}</p>` : ''}</header><dl><dt>File</dt><dd>${esc(book.filename)}</dd><dt>Folder</dt><dd>${esc(book.folder === '.' ? 'Bookshelf root' : book.folder)}</dd><dt>Format</dt><dd>${esc(book.format.toUpperCase())}</dd><dt>Size</dt><dd>${size(book.size)}</dd><dt>Modified</dt><dd>${esc(new Date(book.modifiedAt).toLocaleString())}</dd>${book.publisher ? `<dt>Publisher</dt><dd>${esc(book.publisher)}</dd>` : ''}${book.publishedAt ? `<dt>Published</dt><dd>${esc(book.publishedAt)}</dd>` : ''}${book.isbn ? `<dt>ISBN</dt><dd>${esc(book.isbn)}</dd>` : ''}${book.language ? `<dt>Language</dt><dd>${esc(book.language)}</dd>` : ''}<dt>State</dt><dd>${book.available ? 'Available' : 'Unavailable'}</dd></dl><div class="metadata-search"><input id="metadata-query" value="${esc(book.title)}" placeholder="Title, author, or ISBN"><button onclick="searchBookMetadata(${book.id})">Search metadata</button></div>${book.available ? '<p>Open this book with your system reader.</p>' : '<p>This file is unavailable. Sync after locating it in the file browser.</p>'}<label for="book-status">Reading status</label><select id="book-status"><option value="">Not set</option><option value="unread">Unread</option><option value="reading">Reading</option><option value="finished">Finished</option><option value="paused">Paused</option></select><label for="book-tags">Tags</label><input id="book-tags" value="${esc(book.tags)}" placeholder="programming, design, reference"><label for="book-notes">Notes</label><textarea id="book-notes" placeholder="Personal notes">${esc(book.notes)}</textarea><div class="detail-actions">${book.available ? `<button class="primary" onclick="openBook(${book.id})">Open with system reader</button>` : ''}<button class="primary" onclick="saveBook(${book.id})">Save metadata</button><button onclick="document.querySelector('#detail-dialog').close()">Close</button></div>`;
      pinDialogActions('#detail-content'); document.querySelector('#book-status').value = book.status; dialog.showModal();
    }
    function pinDialogActions(selector) { const root = document.querySelector(selector); const actions = root.querySelector('.detail-actions'); if (actions) { actions.classList.add('dialog-actions'); root.prepend(actions); } }
    async function saveBook(id) { const body = {status: document.querySelector('#book-status').value, tags: document.querySelector('#book-tags').value, notes: document.querySelector('#book-notes').value}; const response = await fetch('/api/book/' + id, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); if (!response.ok) { alert(await response.text()); return; } document.querySelector('#detail-dialog').close(); await load(); }
    async function searchBookMetadata(id) { const input = document.querySelector('#metadata-query'), button = document.querySelector('.metadata-search button'); const query = input.value.trim(); if (!query) { alert('Enter a title, author, or ISBN.'); return; } button.disabled = true; button.textContent = 'Searching...'; try { const response = await fetch('/api/metadata/search', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({bookId: id, query})}); if (!response.ok) throw new Error(await response.text()); const result = await response.json(); if (!result.candidates) { alert('No online matches found.'); return; } await showOnlineCandidates(); } catch (error) { alert(error.message); } finally { button.disabled = false; button.textContent = 'Search metadata'; } }
    let metadataWatching = false;
    function setMetadataButtons(status) { const local = document.querySelector('#refresh-metadata'), online = document.querySelector('#fetch-online'); const running = status.running; local.disabled = running; online.disabled = running; if (running) { const progress = status.total ? ` ${status.current}/${status.total}` : ''; const label = status.operation === 'online' ? 'Fetching online metadata' : 'Refreshing metadata'; local.textContent = status.operation === 'local' ? label + progress : 'Refresh metadata'; online.textContent = status.operation === 'online' ? label + progress : 'Fetch online metadata'; } else { local.textContent = 'Refresh metadata'; online.textContent = 'Fetch online metadata'; } }
    async function pollMetadataStatus() { const response = await fetch('/api/metadata/status'); if (!response.ok) return; const statusData = await response.json(); setMetadataButtons(statusData); if (metadataWatching && !statusData.running) { metadataWatching = false; if (statusData.error) alert(statusData.error); else if (statusData.operation === 'online') { alert(`Online metadata fetch complete. ${statusData.failed} lookups failed.`); showOnlineCandidates(); } else { alert(`Metadata refresh complete. ${statusData.failed} files could not be read.`); } await load(); } }
    async function startMetadataJob(endpoint, confirmMessage) { if (confirmMessage && !confirm(confirmMessage)) return; const response = await fetch(endpoint, {method: 'POST'}); if (!response.ok) { alert(await response.text()); return; } metadataWatching = true; await pollMetadataStatus(); }
    async function refreshMetadata() { await startMetadataJob('/api/metadata/refresh'); }
    async function fetchOnlineMetadata() { await startMetadataJob('/api/metadata/fetch-online', 'Contact Open Library and fetch review candidates? Existing metadata will not be changed.'); }
    async function showOnlineCandidates() { const response = await fetch('/api/metadata/candidates'); if (!response.ok) { alert(await response.text()); return; } const data = await response.json(); const grouped = {}; data.candidates.forEach(item => (grouped[item.bookId] ||= {title: item.bookTitle, candidates: []}).candidates.push(item)); const sections = Object.values(grouped).map(group => `<section class="online-book"><h3>${esc(group.title)}</h3>${group.candidates.map(item => `<label class="online-option"><input type="radio" name="online-book-${item.bookId}" value="${item.id}"><span>${item.coverUrl ? `<img src="${esc(item.coverUrl)}" alt="" onerror="this.style.display='none'">` : ''}</span><span><strong>${esc(item.title)}</strong><small>${esc(item.author)}${item.publisher ? ` · ${esc(item.publisher)}` : ''}${item.publishedAt ? ` · ${esc(item.publishedAt)}` : ''}${item.isbn ? ` · ISBN ${esc(item.isbn)}` : ''}</small></span></label>`).join('')}</section>`).join(''); document.querySelector('#online-content').innerHTML = `<h2>Online metadata candidates</h2><p>Choose the correct match for each book. Nothing is applied until you confirm.</p>${sections || '<p>No online candidates are waiting for review.</p>'}<div class="detail-actions"><span id="online-selected-count">Selected: 0</span>${data.count ? '<button class="primary" onclick="applyOnlineMetadata()">Apply selected metadata</button>' : ''}<button onclick="document.querySelector('#online-dialog').close()">Close</button></div>`; pinDialogActions('#online-content'); document.querySelectorAll('.online-option input').forEach(input => input.addEventListener('change', updateOnlineSelectedCount)); updateOnlineSelectedCount(); document.querySelector('#online-dialog').showModal(); }
    async function applyOnlineMetadata() { const ids = [...document.querySelectorAll('.online-option input:checked')].map(input => Number(input.value)); if (!ids.length) { alert('Select at least one metadata match.'); return; } const response = await fetch('/api/metadata/apply-online', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({candidateIds: ids})}); if (!response.ok) { alert(await response.text()); return; } const result = await response.json(); alert(`Applied metadata to ${result.applied} books.`); document.querySelector('#online-dialog').close(); await load(); }
    function updateOnlineSelectedCount() { const count = document.querySelectorAll('.online-option input:checked').length; const indicator = document.querySelector('#online-selected-count'); if (indicator) indicator.textContent = `Selected: ${count}`; }
    async function showOrganization() { const response = await fetch('/api/organize/preview'); if (!response.ok) { alert(await response.text()); return; } const data = await response.json(); const dialog = document.querySelector('#organize-dialog'); const rows = data.proposals.map(item => `<tr><td>${esc(item.current)}</td><td>${esc(item.proposed)}${item.collision ? ' <span class="collision">Collision</span>' : ''}</td></tr>`).join(''); const hasCollision = data.proposals.some(item => item.collision); document.querySelector('#organize-content').innerHTML = `<h2>Organization preview</h2><p>This is a proposal only. No files have been moved or renamed. Topics and reading status stay in metadata rather than folders.</p><table class="organization-table"><thead><tr><th>Current path</th><th>Human-readable proposal</th></tr></thead><tbody>${rows || '<tr><td colspan="2">No available books.</td></tr>'}</tbody></table><div class="detail-actions">${hasCollision ? '<span class="collision">Resolve collisions before applying.</span>' : '<button class="primary" onclick="applyOrganization()">Apply moves</button>'}<button onclick="undoOrganization()">Undo last run</button><button onclick="document.querySelector('#organize-dialog').close()">Close</button></div>`; pinDialogActions('#organize-content'); dialog.showModal(); }
    async function applyOrganization() { if (!confirm('Move files into the proposed Author/Title/Title.ext folders? This will not overwrite files.')) return; const response = await fetch('/api/organize/apply', {method: 'POST'}); if (!response.ok) { alert(await response.text()); return; } const result = await response.json(); alert(`${result.moved} files moved.`); document.querySelector('#organize-dialog').close(); await load(); }
    async function undoOrganization() { if (!confirm('Undo the latest organization run?')) return; const response = await fetch('/api/organize/undo', {method: 'POST'}); if (!response.ok) { alert(await response.text()); return; } const result = await response.json(); alert(`${result.undone} files restored.`); document.querySelector('#organize-dialog').close(); await load(); }
    async function showCleanup() { const response = await fetch('/api/cleanup/candidates'); if (!response.ok) { alert(await response.text()); return; } const data = await response.json(); const dialog = document.querySelector('#cleanup-dialog'); const cards = data.candidates.map(item => `<label class="candidate"><input class="cleanup-check" type="checkbox" value="${item.id}"><span><span class="reason">${esc(item.reason.replaceAll('_', ' '))}</span><strong>${esc(item.title || item.path)}</strong><small>${esc(item.path)}${item.duplicateOf ? `<br>Keep: ${esc(item.duplicateOf)}` : ''}</small>${item.reason === 'unavailable_record' ? '<p>This only removes the missing record from the catalogue.</p>' : '<p>The file will be moved to the recoverable cleanup trash.</p>'}</span></label>`).join(''); document.querySelector('#cleanup-content').innerHTML = `<h2>Cleanup candidates (${data.count})</h2><p>Select candidates to process. Book files are moved to <code>.book-manager/trash/</code>, not permanently deleted. Unavailable records are forgotten from SQLite.</p>${cards || '<p>No cleanup candidates found.</p>'}<div class="detail-actions"><span id="cleanup-selected-count">Selected: 0</span>${data.count ? '<button class="primary" onclick="deleteCleanup()">Delete selected candidates</button>' : ''}<button onclick="document.querySelector('#cleanup-dialog').close()">Close</button></div>`; pinDialogActions('#cleanup-content'); document.querySelectorAll('.cleanup-check').forEach(input => input.addEventListener('change', updateCleanupSelectedCount)); updateCleanupSelectedCount(); dialog.showModal(); }
    async function deleteCleanup() { const ids = [...document.querySelectorAll('.cleanup-check:checked')].map(input => Number(input.value)); if (!ids.length) { alert('Select at least one candidate.'); return; } if (!confirm('Process the selected cleanup candidates? Book files will be moved to recoverable trash.')) return; const response = await fetch('/api/cleanup/delete', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids})}); if (!response.ok) { alert(await response.text()); return; } const result = await response.json(); alert(`${result.deleted} files moved to cleanup trash; ${result.forgotten} records forgotten.`); document.querySelector('#cleanup-dialog').close(); await load(); }
    function updateCleanupSelectedCount() { const count = document.querySelectorAll('.cleanup-check:checked').length; const indicator = document.querySelector('#cleanup-selected-count'); if (indicator) indicator.textContent = `Selected: ${count}`; }
    async function forgetRecord(id) { if (!confirm('Remove this unavailable record from the catalogue? The original file is already missing and will not be touched.')) return; const response = await fetch('/api/cleanup/forget/' + id, {method: 'POST'}); if (!response.ok) { alert(await response.text()); return; } showCleanup(); await load(); }
    function heartbeat() { fetch('/api/heartbeat', {method: 'POST', keepalive: true}).catch(() => {}); }
    let timer; search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 150); }); format.addEventListener('change', load); status.addEventListener('change', load);
    document.querySelector('#organize').addEventListener('click', showOrganization);
    document.querySelector('#cleanup').addEventListener('click', showCleanup);
    document.querySelector('#refresh-metadata').addEventListener('click', refreshMetadata);
    document.querySelector('#fetch-online').addEventListener('click', fetchOnlineMetadata);
    document.querySelector('#review-online').addEventListener('click', showOnlineCandidates);
    sync.addEventListener('click', async () => { sync.disabled = true; sync.textContent = 'Syncing...'; try { const response = await fetch('/api/sync', {method: 'POST'}); if (!response.ok) throw new Error(await response.text()); await load(); } catch (error) { summary.textContent = `Sync failed: ${error.message}`; } finally { sync.disabled = false; sync.textContent = 'Sync bookshelf'; } });
    heartbeat(); setInterval(heartbeat, 5000); window.addEventListener('pagehide', () => navigator.sendBeacon('/api/heartbeat', '')); load(); pollMetadataStatus(); setInterval(load, 2000); setInterval(pollMetadataStatus, 1000);
  </script>
</body>
</html>
