<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookshelf</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f1eb; --panel: #fffdf8; --ink: #24231f; --muted: #777268; --line: #ded8cd; --accent: #9b4d2f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #201f1c; --panel: #2a2925; --ink: #f2eee5; --muted: #aaa398; --line: #45413a; --accent: #e18a64; } }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
    header { border-bottom: 1px solid var(--line); padding: 28px max(20px, calc((100vw - 1180px) / 2)); }
    header h1 { margin: 0 0 5px; font: 700 30px Georgia, serif; letter-spacing: -.03em; } header p { color: var(--muted); margin: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; } input, select, button { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); padding: 10px 12px; font: inherit; } input { flex: 1 1 300px; } button { cursor: pointer; } button:hover { border-color: var(--accent); } .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #summary { color: var(--muted); margin: 12px 0 18px; } .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; } article.unavailable { opacity: .65; } article h2 { font: 600 18px Georgia, serif; margin: 0 0 7px; overflow-wrap: anywhere; } article p { margin: 4px 0; color: var(--muted); overflow-wrap: anywhere; } .folder { font-size: 12px; } .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 13px 0; } .badge { border: 1px solid var(--line); border-radius: 99px; color: var(--muted); padding: 3px 8px; font-size: 12px; text-transform: uppercase; } .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .empty { color: var(--muted); text-align: center; padding: 50px 10px; grid-column: 1 / -1; }
    dialog { width: min(900px, calc(100% - 30px)); max-height: calc(100% - 30px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); } dialog::backdrop { background: #0008; } .detail { padding: 24px; } .detail header { padding: 0 0 16px; border: 0; } .detail h2 { font: 700 26px Georgia, serif; margin: 0 0 6px; overflow-wrap: anywhere; } .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 18px; margin: 20px 0; } .detail dt { color: var(--muted); } .detail dd { margin: 0; overflow-wrap: anywhere; } .detail iframe { width: 100%; height: 55vh; border: 1px solid var(--line); } .detail-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <header><h1>Bookshelf</h1><p>A local catalogue of your existing files. Nothing is moved or renamed during sync.</p></header>
  <main>
    <div class="toolbar"><input id="search" type="search" placeholder="Search title, author, folder, or filename" autofocus><select id="format"><option value="">All formats</option><option>epub</option><option>pdf</option><option>cbz</option><option>mobi</option><option>azw3</option><option>fb2</option><option>txt</option></select><button id="sync" class="primary">Sync bookshelf</button></div>
    <div id="summary">Loading catalogue...</div><section id="books" class="grid"></section>
  </main>
  <dialog id="detail-dialog"><div id="detail-content" class="detail"></div></dialog>
  <script>
    const search = document.querySelector('#search'), format = document.querySelector('#format'), books = document.querySelector('#books'), summary = document.querySelector('#summary'), sync = document.querySelector('#sync');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const size = bytes => bytes < 1048576 ? `${Math.round(bytes / 1024)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
    async function load() {
      const params = new URLSearchParams({q: search.value, format: format.value});
      const response = await fetch('/api/books?' + params); const data = await response.json();
      const unavailable = data.books.filter(book => !book.available).length;
      summary.textContent = `${data.count} ${data.count === 1 ? 'book' : 'books'} indexed${unavailable ? `, ${unavailable} unavailable` : ''}`;
      books.innerHTML = data.books.length ? data.books.map(book => `<article class="${book.available ? '' : 'unavailable'}"><h2>${esc(book.title)}</h2>${book.author ? `<p>by ${esc(book.author)}</p>` : ''}<p class="folder">${esc(book.folder === '.' ? 'Bookshelf root' : book.folder)}</p><div class="meta"><span class="badge">${esc(book.format)}</span><span class="badge">${size(book.size)}</span>${book.available ? '' : '<span class="badge">Unavailable</span>'}</div><div class="actions"><small title="${esc(book.path)}">${esc(book.filename)}</small><button onclick="showBook(${book.id})">Details</button></div></article>`).join('') : '<div class="empty">No books match this search.</div>';
    }
    async function openBook(id) { const response = await fetch('/api/open/' + id, {method: 'POST'}); if (!response.ok) alert(await response.text()); }
    async function showBook(id) {
      const response = await fetch('/api/book/' + id); if (!response.ok) { alert(await response.text()); return; }
      const book = await response.json(); const dialog = document.querySelector('#detail-dialog');
      const preview = book.available && book.format === 'pdf' ? `<iframe title="PDF preview" src="/api/preview/${book.id}"></iframe>` : `<p>${book.available ? 'Preview is not available for this format yet.' : 'This file is unavailable. Sync after locating it in the file browser.'}</p>`;
      document.querySelector('#detail-content').innerHTML = `<header><h2>${esc(book.title)}</h2>${book.author ? `<p>by ${esc(book.author)}</p>` : ''}</header><dl><dt>File</dt><dd>${esc(book.filename)}</dd><dt>Folder</dt><dd>${esc(book.folder === '.' ? 'Bookshelf root' : book.folder)}</dd><dt>Format</dt><dd>${esc(book.format.toUpperCase())}</dd><dt>Size</dt><dd>${size(book.size)}</dd><dt>Modified</dt><dd>${esc(new Date(book.modifiedAt).toLocaleString())}</dd><dt>State</dt><dd>${book.available ? 'Available' : 'Unavailable'}</dd></dl>${preview}<div class="detail-actions">${book.available ? `<button class="primary" onclick="openBook(${book.id})">Open with system reader</button>` : ''}<button onclick="document.querySelector('#detail-dialog').close()">Close</button></div>`;
      dialog.showModal();
    }
    let timer; search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 150); }); format.addEventListener('change', load);
    sync.addEventListener('click', async () => { sync.disabled = true; sync.textContent = 'Syncing...'; try { const response = await fetch('/api/sync', {method: 'POST'}); if (!response.ok) throw new Error(await response.text()); const result = await response.json(); summary.textContent = `Sync complete: ${result.indexed} indexed${result.renamed ? `, ${result.renamed} renamed` : ''}${result.unavailable ? `, ${result.unavailable} unavailable` : ''}`; await load(); } catch (error) { summary.textContent = `Sync failed: ${error.message}`; } finally { sync.disabled = false; sync.textContent = 'Sync bookshelf'; } });
    load();
  </script>
</body>
</html>
